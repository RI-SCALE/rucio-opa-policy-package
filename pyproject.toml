[project]
name = "rucio-opa-v1-policy"
version = "0.1.0"
description = "Rucio policy package that delegates permission checks to OPA, deciding by the token's claims"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # rucio and flask come from the Rucio server it is loaded into
license = "Apache-2.0"
license-files = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flask>=3.0",
    "import-linter>=2.1",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.17.6",
    "testcontainers>=4.9",
    "pip-audit>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S",
          "C4", "PIE", "RET", "RSE", "PERF", "PT", "PTH", "BLE", "N", "A", "RUF"]
ignore = ["UP006", "UP035"]  # keep typing imports Python 3.9-compatible

[tool.ruff.lint.per-file-ignores]
"src/**" = [
    "S310",  # urlopen on configured OPA/issuer URLs
]
"tests/**" = [
    "S101",  # assert is fine in tests
    "S105",  # dummy tokens in tests
    "S106",  # test credentials
    "S107",
]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["rucio_opa_v1_policy"]

[[tool.mypy.overrides]]
module = ["rucio.*", "flask", "sqlalchemy", "sqlalchemy.*"]  # provided by the Rucio server at runtime
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Docker (testcontainers) or POLICY_TEST_OPA_URL",
]

[tool.coverage.run]
source = ["rucio_opa_v1_policy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Architecture contracts.
[tool.importlinter]
root_packages = ["rucio_opa_v1_policy", "tests"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "OPA client depends on the standard library only"
type = "forbidden"
source_modules = ["rucio_opa_v1_policy.opa_client"]
forbidden_modules = ["flask", "rucio", "rucio_opa_v1_policy.permission"]

[[tool.importlinter.contracts]]
name = "Unit tests need no containers"
type = "forbidden"
source_modules = ["tests.unit"]
forbidden_modules = ["testcontainers"]